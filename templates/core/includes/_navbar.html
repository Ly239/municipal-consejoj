{% load static %}
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <!-- LOGO -->
    <a class="navbar-brand" href="{% url 'home' %}">
      <!-- Pon aquí tu imagen del logo: -->
      <img src="{% static 'img/logo_concejo.png' %}" alt="Concejo" style="height: 45px;">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" href="{% url 'home' %}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'documents:document_list' %}">Documentos</a></li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'documents:gazette_list' %}">
          <i class="fas fa-book me-1"></i>Gacetas
          </a>
        </li>
      </ul>
    </div>

    <!-- BOTONES DERECHA -->
    <div class="d-flex gap-2">
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}" class="btn btn-nav-outline">
          <i class="fas fa-user me-1"></i>{{ user.username }}
        </a>
        <a href="{% url 'logout' %}" class="btn btn-nav-fill">
          <i class="fas fa-sign-out-alt me-1"></i>Salir
        </a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-nav-outline">Iniciar Sesión</a>
        <!-- Puedes agregar un botón de Registro si lo tienes -->
        <a href="{% url 'register' %}" class="btn btn-nav-fill">Registrarse</a>
      {% endif %}
    </div>
  </div>
</nav>
