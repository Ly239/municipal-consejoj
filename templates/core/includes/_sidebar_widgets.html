{% load static %}
<!-- ============================================ -->
<!-- SIDEBAR WIDGETS (Categorías + Redes Sociales) -->
<!-- ============================================ -->

<!-- Widget de Categorías (Grid 2x2) -->
<div class="sidebar-card">
    <div class="sidebar-header">Categorías</div>
    <div class="p-3">
        <div class="row g-2">
            <!-- Deportes -->
            <div class="col-6">
                <div class="category-card">
                    <div class="category-icon"><i class="fas fa-futbol"></i></div>
                    <div class="category-label">Deportes</div>
                </div>
            </div>
            <!-- Cultural -->
            <div class="col-6">
                <div class="category-card">
                    <div class="category-icon"><i class="fas fa-theater-masks"></i></div>
                    <div class="category-label">Cultural</div>
                </div>
            </div>
            <!-- Social -->
            <div class="col-6">
                <div class="category-card">
                    <div class="category-icon"><i class="fas fa-hands-helping"></i></div>
                    <div class="category-label">Social</div>
                </div>
            </div>
            <!-- Salud -->
            <div class="col-6">
                <div class="category-card">
                    <div class="category-icon"><i class="fas fa-heartbeat"></i></div>
                    <div class="category-label">Salud</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Widget de Redes Sociales -->
<div class="sidebar-card">
    <div class="sidebar-header">Compartir</div>
    <div class="p-3 d-flex flex-wrap gap-2">
        <a href="#" class="share-btn facebook" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="share-btn twitter" aria-label="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
        <a href="#" class="share-btn whatsapp" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        <a href="#" class="share-btn instagram" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" class="share-btn threads" aria-label="Threads"><i class="fab fa-threads"></i></a>
    </div>
</div>
