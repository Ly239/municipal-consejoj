{% load static %}
<!doctype html>
<html lang="es" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#003B4F" />

    <title>{% block title %}Concejo Municipal de Junín{% endblock %}</title>

    <!-- ============================================================ -->
    <!-- Google Fonts (Inter) - ACTIVO (requiere internet)             -->
    <!-- Si no hay internet, el navegador usa la fuente del sistema.   -->
    <!-- ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ============================================================ -->
    <!-- BOOTSTRAP CSS - LOCAL (ACTIVO)                                -->
    <!-- Se usa local para evitar conflictos de doble carga que rompen -->
    <!-- los componentes (acordeones, modales, dropdowns).             -->
    <!-- ============================================================ -->
    <link rel="stylesheet" href="{% static 'core/bootstrapk/css/bootstrap.min.css' %}" />

    <!-- ============================================================ -->
    <!-- BOOTSTRAP CSS - CDN (COMENTADO)                               -->
    <!-- Descomentar SOLO si se desactiva el local. NUNCA ambos.       -->
    <!-- ============================================================ -->
    <!--
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />
    -->

    <!-- ============================================================ -->
    <!-- Font Awesome - ACTIVO (requiere internet para iconos)         -->
    <!-- Si no hay internet, los iconos no cargan pero nada se rompe.  -->
    <!-- ============================================================ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Estilos personalizados del proyecto -->
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}" />

    {% block extra_css %}{% endblock %}
  </head>

  <body class="d-flex flex-column h-100">
    <!-- ============================================ -->
    <!-- MENSAJES DEL SISTEMA                         -->
    <!-- ============================================ -->
    {% if messages %}
    <div class="container mt-3">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <!-- ============================================ -->
    <!-- CONTENIDO PRINCIPAL                          -->
    <!-- ============================================ -->
    <main class="flex-shrink-0">
      <div class="container mt-4">
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- ============================================================ -->
    <!-- BOOTSTRAP JS - LOCAL (ACTIVO)                                 -->
    <!-- ============================================================ -->
    <script src="{% static 'core/bootstrapk/js/bootstrap.bundle.min.js' %}"></script>

    <!-- ============================================================ -->
    <!-- BOOTSTRAP JS - CDN (COMENTADO)                                -->
    <!-- Descomentar SOLO si se desactiva el local. NUNCA ambos.       -->
    <!-- ============================================================ -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    -->

    {% block extra_scripts %}{% endblock %}

    <!-- ============================================================ -->
    <!-- Auto-cierre de mensajes (guardado contra fallo de Bootstrap)  -->
    <!-- ============================================================ -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Guarda defensiva: si Bootstrap no está disponible, no ejecutar
        if (typeof bootstrap === "undefined") return;

        const alerts = document.querySelectorAll(".alert");
        alerts.forEach((alert) => {
          setTimeout(() => {
            if (alert.classList.contains("show")) {
              const bsAlert = new bootstrap.Alert(alert);
              bsAlert.close();
            }
          }, 5000);
        });
      });
    </script>
  </body>
</html>
