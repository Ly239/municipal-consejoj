{% extends 'core/base.html' %}
{% load static %}

{% block title %}Editar Categoría - Concejo Municipal de Junín{% endblock %}

{% block content %}
{% include 'core/includes/_navbar_public.html' %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-concejo p-4 shadow-sm border-0">
                <h3 class="fw-bold mb-4" style="color: var(--color-dark-blue);">Editar Categoría: {{ category.name }}</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Nombre de la Categoría</label>
                        {{ form.name }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'core:manage_categories_frontend' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn text-white fw-bold rounded-pill px-4" style="background-color: var(--color-dark-blue);">Actualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
